  D.members.forEach(function(p){var i=idx[bkey(kst(p.at),g)];if(i!=null)A.signup[i]++;});
  D.progress.forEach(function(x){var i=idx[bkey(kst(x.at),g)];if(i!=null)A.learners[i][x.u]=1;if(x.done){var j=idx[bkey(kst(x.done),g)];if(j!=null)A.done[j]++;}});
  A.net=all.map(function(_,i){return A.gross[i]-A.refund[i];});
  A.aov=all.map(function(_,i){return A.orders[i]?A.gross[i]/A.orders[i]:0;});
  var sum=function(a,from,to){var s=0;for(var i=from;i<to;i++)s+=a[i];return s;};
  var tot=function(from,to){var o={};['gross','refund','orders','signup','net','done'].forEach(function(k){o[k]=sum(A[k],from,to);});o.aov=o.orders?o.gross/o.orders:0;
    var u={};for(var i=from;i<to;i++)Object.assign(u,A.learners[i]);o.learners=Object.keys(u).length;return o;};
  /* 기간 안 주문(상품·결제수단 분석용) */
  var start=cur[0].k, inCur=function(t){return t&&bkey(kst(t),g)>=start;};
  var cut=function(a){return a.slice(n);};
  var series={};['gross','refund','orders','signup','net','aov','done'].forEach(function(k){series[k]=cut(A[k]);});
  series.learners=cut(A.learners).map(function(o){return Object.keys(o).length;});
  return {b:cur,series:series,cur:tot(n,n*2),prev:tot(0,n),orders:O.filter(function(o){return inCur(o.paid);}),members:D.members.filter(function(p){return inCur(p.at);})};
}
function delta(c,p,bad){
  if(!p)return c?'<em class="dl up'+(bad?' bad':'')+'">새로 생김</em>':'<em class="dl">변화 없음</em>';
  var r=(c-p)/p*100,up=r>=0,cls=Math.abs(r)<0.5?'':(up!==!!bad?'good':'bad');
  return '<em class="dl '+cls+'">'+(Math.abs(r)<0.5?'':up?'▲ ':'▼ ')+Math.abs(r).toFixed(Math.abs(r)<10?1:0)+'%</em>';}

function chart(host,o){

    var cw=iw/n,bw=Math.max(Math.min(cw*0.62,46),3),y=function(v){return pt+ih-(v/mx)*ih;},yl=function(v){return pt+ih-(v/lx)*ih;};
    var step=Math.ceil(n/Math.max(Math.floor(iw/58),1)),h='<svg width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(o.title||'')+'">';

      if((n-1-i)%step===0)h+='<text class="ax" x="'+(pl+cw*i+cw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';});
    if(o.line){h+='<path class="ln" d="'+o.line.map(function(v,i){return (i?'L':'M')+(pl+cw*i+cw/2).toFixed(1)+' '+yl(v).toFixed(1);}).join('')+'"/>';
      o.line.forEach(function(v,i){h+='<circle class="ld" cx="'+(pl+cw*i+cw/2).toFixed(1)+'" cy="'+yl(v).toFixed(1)+'" r="2.5"/>';});}
    h+='<line class="hv" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" visibility="hidden"/>';
    o.v.forEach(function(_,i){h+='<rect class="hit" data-i="'+i+'" x="'+(pl+cw*i)+'" y="'+pt+'" width="'+cw+'" height="'+ih+'"/>';});
    host.innerHTML=h+'</svg><div class="tip" hidden></div>';
    var tip=host.querySelector('.tip'),hv=host.querySelector('.hv');
    var show=function(i){var cx=pl+cw*i+cw/2;hv.setAttribute('x1',cx);hv.setAttribute('x2',cx);hv.setAttribute('visibility','visible');tip.innerHTML=o.tip(i);tip.hidden=false;
      var tw=tip.offsetWidth;tip.style.left=Math.min(Math.max(cx-tw/2,0),W-tw)+'px';};
    $$('.hit',host).forEach(function(r){r.addEventListener('mouseenter',function(){show(+r.getAttribute('data-i'));});r.addEventListener('click',function(){show(+r.getAttribute('data-i'));});});

  };
  draw();host._draw=draw;}

V.members=function(m,id){

  m.innerHTML='<h1>회원</h1><p class="sub">회원을 누르면 수강권·주문을 보고, 수강권을 직접 주거나 회수할 수 있어요.</p><div class="bar"><input type="search" id="mq" placeholder="이름, 이메일"></div><div id="ml"></div>';
  var load=function(){api('members',{q:$('#mq').value}).then(function(d){var L=d.members;
    $('#ml').innerHTML=L.length?'<div class="tw"><table><thead><tr><th>이름</th><th>이메일</th><th>로그인</th><th class="num">수강</th><th>소식</th><th>가입일</th></tr></thead><tbody>'+L.map(function(p){
      return '<tr class="click" data-id="'+p.id+'"><td>'+esc(p.name||'-')+(p.admin?' '+tag('운영자','green'):'')+'</td><td>'+esc(p.email)+'</td><td>'+(LOGIN[p.login_method]||p.login_method)+'</td><td class="num">'+p.courses+'</td><td>'+(p.marketing_ok?'받음':'-')+'</td><td class="nowrap">'+day(p.created_at)+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">회원이 없어요</div>';
    $$('tr[data-id]',m).forEach(function(r){r.onclick=function(){location.hash='members/'+r.getAttribute('data-id');};});});};
  var tm;$('#mq').oninput=function(){clearTimeout(tm);tm=setTimeout(load,300);};load();
};
function memberDetail(m,id){api('member',{id:id}).then(function(d){var p=d.member;if(!p){m.innerHTML='<div class="empty">회원을 찾지 못했어요</div>';return;}
  m.innerHTML='<button class="back" onclick="location.hash=\'members\'">‹ 회원 목록</button><h1>'+esc(p.name||p.email)+'</h1><p class="sub">'+esc(p.email)+' · '+(LOGIN[p.login_method]||'')+' 로그인 · '+day(p.created_at)+' 가입</p>'+
    '<h2>수강권</h2><div class="bar"><select id="gC">'+COURSES.map(function(c){return '<option value="'+esc(c.id)+'">'+esc(c.title)+'</option>';}).join('')+'</select><button class="btn" id="gGo">수강권 주기</button></div>'+
    (d.enrollments.length?'<div class="tw"><table><thead><tr><th>강의</th><th>경로</th><th>시작</th><th>진도</th><th>상태</th><th></th></tr></thead><tbody>'+d.enrollments.map(function(e){
      return '<tr><td>'+esc(courseName(e.course_id))+'</td><td>'+(SRC[e.source]||e.source)+'</td><td class="nowrap">'+day(e.started_at)+'</td><td class="nowrap">'+pbar(e.pct)+'</td><td>'+(e.revoked_at?tag('회수됨'):tag('이용 중','green'))+'</td><td class="num">'+(e.revoked_at?'':'<button class="btn s" data-rv="'+e.id+'">회수</button>')+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">수강권이 없어요</div>')+
    '<h2>주문</h2>'+(d.orders.length?'<div class="tw"><table><thead><tr><th>결제일</th><th>상품</th><th class="num">금액</th><th>상태</th></tr></thead><tbody>'+d.orders.map(function(o){var s=ST[o.status]||[o.status,''];return '<tr><td>'+day(o.paid_at)+'</td><td>'+esc(itemName(o.item_id))+(o.is_test?' '+tag('테스트'):'')+'</td><td class="num">'+won(o.amount)+'</td><td>'+tag(s[0],s[1])+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">주문이 없어요</div>');
  $('#gGo').onclick=function(){if(!confirmTxt('이 회원에게 「'+courseName($('#gC').value)+'」 수강권을 줄까요?'))return;act({action:'grant',userId:id,courseId:$('#gC').value}).then(function(){toast('수강권을 줬어요');memberDetail(m,id);});};
  $$('[data-rv]',m).forEach(function(b){b.onclick=function(){if(!confirmTxt('이 수강권을 회수할까요? 회원은 바로 강의를 볼 수 없게 돼요.'))return;act({action:'revoke',enrollmentId:+b.getAttribute('data-rv')}).then(function(){toast('회수했어요');memberDetail(m,id);});};});
});}
function confirmTxt(t){return window.confirm(t);}

/* ── 기업 ── */
V.companies=function(m,id){
  if(id)return companyDetail(m,id);
  api('companies').then(function(d){var L=d.companies;
    m.innerHTML='<h1>기업</h1><p class="sub">계약한 기업을 등록하고 담당자와 수강권 묶음을 정해요. 담당자는 내 학습의 「기업 관리」에서 구성원을 초대·배정해요.</p><div class="bar"><button class="btn p" id="cNew">기업 등록</button></div>'+
      (L.length?'<div class="tw"><table><thead><tr><th>회사</th><th>사업자번호</th><th class="num">수강권</th><th class="num">구성원</th><th>등록일</th></tr></thead><tbody>'+L.map(function(c){return '<tr class="click" data-id="'+c.id+'"><td>'+esc(c.name)+'</td><td>'+esc(c.biz_no||'-')+'</td><td class="num">'+c.seats+'</td><td class="num">'+c.members+'</td><td>'+day(c.created_at)+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">등록한 기업이 없어요</div>');
    $$('tr[data-id]',m).forEach(function(r){r.onclick=function(){location.hash='companies/'+r.getAttribute('data-id');};});
    $('#cNew').onclick=function(){openDlg('<h3>기업 등록</h3><div class="f"><label>회사명<input id="cN" maxlength="80"></label><label>사업자등록번호 (선택)<input id="cB" maxlength="20" placeholder="000-00-00000"></label><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="cGo">등록</button></div></div>');
      $('#cGo').onclick=function(){var n=$('#cN').value.trim();if(!n){toast('회사명을 넣어 주세요');return;}act({action:'company_create',name:n,bizNo:$('#cB').value}).then(function(d){closeDlg();location.hash='companies/'+d.company.id;});};};
  });
};
function companyDetail(m,id){api('company',{id:id}).then(function(d){var c=d.company;if(!c){m.innerHTML='<div class="empty">기업을 찾지 못했어요</div>';return;}
  m.innerHTML='<button class="back" onclick="location.hash=\'companies\'">‹ 기업 목록</button><h1>'+esc(c.name)+'</h1><p class="sub">'+(c.biz_no?'사업자번호 '+esc(c.biz_no)+' · ':'')+day(c.created_at)+' 등록</p>'+
    '<div class="grid2"><div class="box"><h3>담당자</h3>'+(d.admins.length?d.admins.map(function(a){return '<div class="bar" style="justify-content:space-between;margin:0 0 8px"><span>'+esc(a.name||'')+' <span class="muted small">'+esc(a.email)+'</span></span><button class="btn s" data-ra="'+esc(a.email)+'">빼기</button></div>';}).join(''):'<p class="muted small">아직 없어요</p>')+
      '<div class="bar" style="margin:8px 0 0"><input type="search" id="aE" placeholder="담당자 회원 이메일"><button class="btn" id="aGo">지정</button></div><p class="small muted" style="margin:6px 0 0">담당자는 먼저 CHA&amp;I에 회원가입해야 해요.</p></div>'+
    '<div class="box"><h3>수강권 묶음</h3>'+(d.seats.length?d.seats.map(function(s){return '<div style="margin:0 0 8px"><b>'+esc(courseName(s.course_id))+'</b> <span class="muted small">'+s.used+'/'+s.total+'명 배정'+(s.expires_at?' · '+day(s.expires_at)+'까지':'')+'</span></div>';}).join(''):'<p class="muted small">아직 없어요</p>')+
      '<button class="btn" id="sNew">수강권 추가</button></div></div>'+
    '<h2>구성원 '+d.members.length+'명</h2><div class="bar"><button class="btn" id="iNew">구성원 초대</button></div><div id="mem"></div>';
  memberTable($('#mem'),d,function(body){return act(Object.assign({companyId:id},body,{action:'company_'+body.action}));},function(){companyDetail(m,id);});
  $('#aGo').onclick=function(){act({action:'company_admin',companyId:id,email:$('#aE').value}).then(function(){toast('담당자로 지정했어요');companyDetail(m,id);});};
  $$('[data-ra]',m).forEach(function(b){b.onclick=function(){if(!confirmTxt('담당자에서 뺄까요?'))return;act({action:'company_admin',companyId:id,email:b.getAttribute('data-ra'),remove:true}).then(function(){companyDetail(m,id);});};});
  $('#sNew').onclick=function(){openDlg('<h3>수강권 추가</h3><div class="f"><label>강의<select id="sC">'+COURSES.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.title)+'</option>';}).join('')+'</select></label><div class="row"><label>인원<input id="sT" inputmode="numeric" value="10"></label><label>이용 기한 (선택)<input id="sE" type="date"></label></div><label>주문·계약 번호 (선택)<input id="sO" maxlength="64"></label><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="sGo">추가</button></div></div>');
    $('#sGo').onclick=function(){act({action:'seat_add',companyId:id,courseId:$('#sC').value,total:+$('#sT').value,expiresAt:$('#sE').value,orderId:$('#sO').value}).then(function(){closeDlg();toast('수강권을 추가했어요');companyDetail(m,id);});};};
  $('#iNew').onclick=function(){inviteDlg(function(people){return act({action:'company_invite',companyId:id,people:people});},function(){companyDetail(m,id);});};
});}
/* 구성원 표 (운영자·담당자 화면 같은 모양) — window에 내보내 내 학습에서도 씀 */
function memberTable(el,d,call,reload){
  if(!d.members.length){el.innerHTML='<div class="empty">구성원이 없어요. 이메일로 초대하면 같은 이메일로 가입할 때 자동으로 연결돼요.</div>';return;}
  el.innerHTML='<div class="tw"><table><thead><tr><th>구성원</th><th>상태</th><th>배정된 강의 · 진도</th><th></th></tr></thead><tbody>'+d.members.map(function(mb){
    return '<tr><td>'+esc(mb.name||'-')+(mb.dept?' <span class="muted small">'+esc(mb.dept)+'</span>':'')+'<div class="small muted">'+esc(mb.email)+'</div></td><td>'+(mb.status==='active'?tag('가입 완료','green'):tag('초대함','amber'))+'</td>'+
      '<td>'+(mb.assigned.length?mb.assigned.map(function(a){return '<div class="small nowrap">'+esc(courseName(a.course_id))+' '+(mb.status==='active'?pbar(a.pct)+(a.done?' '+tag('수료','green'):''):'<span class="muted">가입 전</span>')+' <button class="btn s" data-un="'+mb.id+':'+a.seat_id+'">회수</button></div>';}).join(''):'<span class="muted small">없음</span>')+'</td>'+
      '<td class="num"><select class="btn s" data-as="'+mb.id+'"><option value="">강의 배정</option>'+d.seats.filter(function(s){return !mb.assigned.some(function(a){return a.seat_id===s.id;});}).map(function(s){return '<option value="'+s.id+'"'+(s.used>=s.total?' disabled':'')+'>'+esc(courseName(s.course_id))+' ('+(s.total-s.used)+' 남음)</option>';}).join('')+'</select> <button class="btn s" data-rm="'+mb.id+'">빼기</button></td></tr>';}).join('')+'</tbody></table></div>';
  $$('[data-as]',el).forEach(function(s){s.onchange=function(){if(!s.value)return;call({action:'assign',memberId:+s.getAttribute('data-as'),seatId:+s.value}).then(function(){toast('배정했어요');reload();},function(){s.value='';});};});
  $$('[data-un]',el).forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-un').split(':');if(!confirmTxt('이 강의 배정을 회수할까요?'))return;call({action:'unassign',memberId:+v[0],seatId:+v[1]}).then(function(){toast('회수했어요');reload();});};});
  $$('[data-rm]',el).forEach(function(b){b.onclick=function(){if(!confirmTxt('구성원에서 뺄까요? 배정된 강의도 모두 회수돼요.'))return;call({action:'remove',memberId:+b.getAttribute('data-rm')}).then(function(){toast('뺐어요');reload();});};});
}
function inviteDlg(send,done){
  openDlg('<h3>구성원 초대</h3><div class="f"><label>한 줄에 한 명: 이메일, 이름, 부서<textarea id="iL" placeholder="kim@company.com, 김하나, 인사팀&#10;lee@company.com, 이두리"></textarea></label><p class="small muted" style="margin:0">초대한 이메일로 CHA&amp;I에 가입·로그인하면 자동으로 연결되고, 배정한 강의가 내 학습에 들어가요.</p><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="iGo">초대</button></div></div>');
  $('#iGo').onclick=function(){var ppl=$('#iL').value.split(/\n/).map(function(l){var p=l.split(/[,\t]/).map(function(x){return x.trim();});return {email:p[0],name:p[1]||'',dept:p[2]||''};}).filter(function(p){return /@/.test(p.email);});
    if(!ppl.length){toast('이메일을 한 줄에 하나씩 넣어 주세요');return;}send(ppl).then(function(d){closeDlg();toast(d.added+'명 초대했어요'+(d.existed?' · '+d.existed+'명은 이미 있어요':''));done();});};
}

/* ── 강의 ── */
V.courses=function(m){api('courses').then(function(d){COURSES=d.courses;
  m.innerHTML='<h1>강의</h1><p class="sub">강의를 열면(사전 예약 → 오픈) 그날이 수강 시작일이 되고, 환불 계산도 그날부터 해요.</p>'+(d.bunny?'':'<div class="note" style="margin:0 0 16px"><b>영상 연결 전</b> · Bunny Stream에 가입하고 Vercel 환경 변수(BUNNY_LIBRARY_ID, BUNNY_STREAM_API_KEY, BUNNY_TOKEN_KEY)를 넣으면 여기서 바로 영상을 올릴 수 있어요. 그 전에는 편 목록만 만들어 둘 수 있어요.</div>')+d.courses.map(function(c){
    return '<div class="box" style="margin:0 0 16px"><div class="bar" style="justify-content:space-between;margin:0 0 10px"><div><b>'+esc(c.title)+'</b> '+(c.is_open?tag('오픈 '+day(c.opened_at),'green'):tag('사전 예약','amber'))+' <span class="small muted">수강 '+c.students+'명 · '+c.lessons.length+'편</span></div><div><button class="btn s" data-open="'+esc(c.id)+'" data-v="'+(c.is_open?0:1)+'">'+(c.is_open?'닫기':'강의 열기')+'</button> <button class="btn s p" data-add="'+esc(c.id)+'">편 추가</button></div></div>'+
      (c.lessons.length?'<div class="tw"><table><thead><tr><th class="num">순서</th><th>단계</th><th>제목</th><th>맛보기</th><th>영상</th><th class="num">길이</th><th></th></tr></thead><tbody>'+c.lessons.map(function(l){return '<tr><td class="num">'+l.sort+'</td><td>'+esc(l.part)+'</td><td>'+esc(l.title)+'</td><td>'+(l.is_free?tag('무료','green'):'')+'</td><td>'+(l.video_id?(l.video_status===4?tag('재생 가능','green'):l.video_status===5?tag('변환 오류','red'):tag('처리 중','amber'))+(d.bunny&&l.video_status!==4?' <button class="btn s" data-vs="'+esc(l.video_id)+'">상태 확인</button>':''):tag('없음','red'))+'</td><td class="num">'+(l.duration_s?Math.round(l.duration_s/60)+'분':'-')+'</td><td class="num"><button class="btn s" data-ed="'+l.id+'">수정</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">편이 없어요. 영상이 준비되면 편을 추가해 주세요.</div>')+'</div>';}).join('');
  $$('[data-open]',m).forEach(function(b){b.onclick=function(){var o=b.getAttribute('data-v')==='1';if(!confirmTxt(o?'강의를 열까요? 오늘이 이 강의 수강생 모두의 수강 시작일이 돼요.':'강의를 닫을까요? 수강생이 볼 수 없게 돼요.'))return;act({action:'course_open',courseId:b.getAttribute('data-open'),open:o}).then(function(){toast(o?'강의를 열었어요':'강의를 닫았어요');V.courses(m);});};});
  var all=[];d.courses.forEach(function(c){all=all.concat(c.lessons);});
  var edit=function(cid,l){l=l||{};var next=1;d.courses.forEach(function(c){if(c.id===cid)next=c.lessons.length+1;});
    openDlg('<h3>'+(l.id?'편 수정':'편 추가')+'</h3><div class="f"><div class="row"><label>순서<input id="lS" inputmode="numeric" value="'+(l.sort||next)+'"></label><label>단계<input id="lP" value="'+esc(l.part||'')+'" placeholder="예: 1단계 세팅"></label></div><label>제목<input id="lT" value="'+esc(l.title||'')+'" maxlength="120"></label><div class="row"><label>Bunny Video ID<input id="lV" value="'+esc(l.video_id||'')+'"'+(d.bunny?'':' placeholder="Bunny 연결 뒤 업로드"')+'></label><label>길이(분)<input id="lD" inputmode="numeric" value="'+(l.duration_s?Math.round(l.duration_s/60):'')+'"></label></div>'+(d.bunny?'<label>영상 파일 올리기 (선택)<input id="lFile" type="file" accept="video/*"></label><div id="lProg" class="small muted"></div>':'')+'<label class="ck"><input type="checkbox" id="lF"'+(l.is_free?' checked':'')+'> 맛보기 (누구나 볼 수 있고, 환불 계산에서 빼요)</label>'+
      '<div class="acts">'+(l.id?'<button class="btn d" id="lX" style="margin-right:auto">삭제</button>':'')+'<button class="btn" data-close>닫기</button><button class="btn p" id="lGo">저장</button></div></div>');
    $('#lGo').onclick=function(){var btn=this,f=$('#lFile')&&$('#lFile').files[0];
      var save=function(){act({action:'lesson_save',id:l.id,courseId:cid,sort:+$('#lS').value,part:$('#lP').value,title:$('#lT').value,videoId:$('#lV').value,durationS:(+$('#lD').value||0)*60,isFree:$('#lF').checked}).then(function(){closeDlg();toast('저장했어요');V.courses(m);},function(){btn.disabled=false;});};
      if(!f){save();return;}
      if(!$('#lT').value.trim()){toast('제목을 먼저 넣어 주세요');return;}
      btn.disabled=true;$('#lProg').textContent='업로드 준비 중이에요';
      uploadVideo(f,$('#lT').value.trim(),function(p){$('#lProg').textContent='업로드 '+p+'% · 창을 닫지 마세요';}).then(function(vid){$('#lV').value=vid;$('#lProg').textContent='업로드 끝 · Bunny가 변환하는 데 몇 분 걸려요';save();},function(){btn.disabled=false;$('#lProg').textContent='업로드하지 못했어요. 다시 시도해 주세요';});
    };
    if(l.id)$('#lX').onclick=function(){if(!confirmTxt('이 편을 지울까요? 수강생의 이 편 진도 기록도 지워져요.'))return;act({action:'lesson_delete',id:l.id}).then(function(){closeDlg();V.courses(m);});};};
  $$('[data-add]',m).forEach(function(b){b.onclick=function(){edit(b.getAttribute('data-add'));};});
  $$('[data-vs]',m).forEach(function(b){b.onclick=function(){b.disabled=true;act({action:'video_status',videoId:b.getAttribute('data-vs')}).then(function(st){toast(['대기','업로드됨','처리 중','변환 중','재생 가능','변환 오류'][st.status]||'확인했어요');V.courses(m);},function(){b.disabled=false;});};});
  $$('[data-ed]',m).forEach(function(b){b.onclick=function(){var l=all.find(function(x){return x.id===+b.getAttribute('data-ed');});edit(l.course_id,l);};});
});};

/* ── 키트 발송 ── */
V.ship=function(m){api('shipments').then(function(d){var L=d.orders;
  var wait=L.filter(function(o){return !o.shipped_at;}),done=L.filter(function(o){return o.shipped_at;});
  var row=function(o){return '<tr><td class="nowrap">'+day(o.paid_at)+'</td><td>'+esc(itemName(o.item_id))+(o.is_test?' '+tag('테스트'):'')+'<div class="small muted">'+esc(o.buyer_email)+'</div></td>'+
    '<td>'+(o.ship_addr?esc(o.ship_name)+' · '+esc(o.ship_phone)+'<div class="small">'+esc(o.ship_addr)+'</div>'+(o.ship_memo?'<div class="small muted">'+esc(o.ship_memo)+'</div>':''):tag('배송지 미입력','red'))+'</td>'+
    '<td>'+(o.shipped_at?dt(o.shipped_at)+(o.ship_tracking?'<div class="small muted">'+esc(o.ship_tracking)+'</div>':''):'')+'</td><td class="num">'+(o.shipped_at?'<button class="btn s" data-undo="'+esc(o.id)+'">발송 취소</button>':(o.ship_addr?'<button class="btn s p" data-sh="'+esc(o.id)+'">발송 처리</button>':''))+'</td></tr>';};
  var tbl=function(rows){return rows.length?'<div class="tw"><table><thead><tr><th>결제일</th><th>주문</th><th>배송지</th><th>발송</th><th></th></tr></thead><tbody>'+rows.map(row).join('')+'</tbody></table></div>':'<div class="empty">없어요</div>';};
  m.innerHTML='<h1>키트 발송</h1><p class="sub">고객은 내 학습 → 주문 내역에서 배송지를 넣어요. 배송 정보는 발송 후 3개월이 지나면 지워 주세요(개인정보처리방침).</p><h2>발송 대기 '+wait.length+'건</h2>'+tbl(wait)+'<h2>발송 완료 '+done.length+'건</h2>'+tbl(done);
  $$('[data-sh]',m).forEach(function(b){b.onclick=function(){openDlg('<h3>발송 처리</h3><div class="f"><label>택배사·송장번호 (선택)<input id="tN" placeholder="예: CJ 1234-5678-9012"></label><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="tGo">발송했어요</button></div></div>');
    $('#tGo').onclick=function(){act({action:'shipped',orderId:b.getAttribute('data-sh'),tracking:$('#tN').value}).then(function(){closeDlg();toast('발송 처리했어요');V.ship(m);});};};});
  $$('[data-undo]',m).forEach(function(b){b.onclick=function(){if(!confirmTxt('발송 처리를 취소할까요?'))return;act({action:'shipped',orderId:b.getAttribute('data-undo'),undo:true}).then(function(){V.ship(m);});};});
});};


/* ── 작업 기록 ── */
var ACTN={refund:'환불',grant:'수강권 부여',revoke:'수강권 회수',company_create:'기업 등록',company_admin:'담당자 지정',seat_add:'수강권 묶음 추가',company_invite:'구성원 초대',company_assign:'강의 배정',company_unassign:'배정 회수',company_remove:'구성원 빼기',course_open:'강의 열기·닫기',lesson_save:'편 저장',lesson_delete:'편 삭제',video_init:'영상 업로드',shipped:'발송 처리'};
V.logs=function(m){api('logs').then(function(d){var L=d.logs;
  m.innerHTML='<h1>작업 기록</h1><p class="sub">운영자가 한 일(환불, 수강권, 기업, 강의, 발송)이 자동으로 남아요. 분쟁이 생기면 근거가 돼요.</p>'+(L.length?'<div class="tw"><table><thead><tr><th>시각</th><th>운영자</th><th>작업</th><th>대상</th><th>내용</th></tr></thead><tbody>'+L.map(function(x){
    var dd=x.detail||{},keys=Object.keys(dd).filter(function(k){return dd[k]!==''&&dd[k]!=null&&typeof dd[k]!=='object';}).slice(0,5);
    return '<tr><td class="nowrap">'+dt(x.created_at)+'</td><td class="small">'+esc(x.email||'')+'</td><td>'+tag(ACTN[x.action]||x.action)+'</td><td class="small">'+esc(x.target||'')+'</td><td class="small muted">'+keys.map(function(k){return esc(k)+': '+esc(String(dd[k]).slice(0,60));}).join(' · ')+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">아직 기록이 없어요</div>');
});};
/* ── 주문 엑셀(CSV) 내보내기: 세무·정산용 ── */
function exportCsv(){api('orders_csv').then(function(d){
  var st={paid:'결제 완료',partial_refunded:'일부 환불',refunded:'환불 완료',canceled:'취소'};
  var rows=[['결제일','주문번호','상품','수량','결제 금액','환불 금액','순매출','상태','테스트','주문자','이메일','결제 수단','환불일','환불 사유']].concat(d.orders.map(function(o){return [o.paid_at?new Date(o.paid_at).toLocaleString('ko-KR'):'',o.id,itemName(o.item_id),o.qty,o.amount,o.refund_amount||0,o.amount-(o.refund_amount||0),st[o.status]||o.status,o.is_test?'예':'',o.buyer_name||'',o.buyer_email,o.method||'',o.refunded_at?new Date(o.refunded_at).toLocaleString('ko-KR'):'',o.refund_reason||''];}));
  var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='chaand-orders-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();toast(d.orders.length+'건을 내보냈어요');
});}
/* ── 영상 업로드: 브라우저 → Bunny로 바로(TUS). 서버는 서명만 줌 ── */
var tusLoad=null;
function loadTus(){if(window.tus)return Promise.resolve();if(tusLoad)return tusLoad;tusLoad=new Promise(function(ok,no){var s=document.createElement('script');s.src='/vendor/tus-4.3.1.min.js';s.onload=ok;s.onerror=function(){tusLoad=null;no();};document.head.appendChild(s);});return tusLoad;}
function uploadVideo(file,title,onProgress){
  return Promise.all([loadTus(),act({action:'video_init',title:title})]).then(function(v){var t=v[1];
    return new Promise(function(ok,no){
      var up=new window.tus.Upload(file,{endpoint:t.endpoint,retryDelays:[0,3000,5000,10000,20000],
        headers:{AuthorizationSignature:t.signature,AuthorizationExpire:String(t.expire),VideoId:t.videoId,LibraryId:String(t.libraryId)},
        metadata:{filetype:file.type,title:title},
        onError:function(e){no(e);},onProgress:function(a,b){onProgress(Math.round(100*a/b));},onSuccess:function(){ok(t.videoId);}});
      up.findPreviousUploads().then(function(p){if(p.length)up.resumeFromPreviousUpload(p[0]);up.start();});
    });
  });
}
/* ── 2단계 인증 (운영자 필수) ── */
function mfaGate(){
  return sb.auth.mfa.listFactors().then(function(r){
    var all=(r.data&&r.data.all)||[],ok=all.filter(function(f){return f.factor_type==='totp'&&f.status==='verified';});
    var done=function(){return sb.auth.refreshSession().then(function(){location.reload();});};
    var codeForm=function(factorId,head){
      $('#root').innerHTML='<div class="gate">'+head+'<div class="f" style="text-align:left;margin-top:16px"><label>인증 앱의 6자리 숫자<input id="mfC" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="btn p" id="mfGo">확인</button><p class="small muted" id="mfE"></p></div></div>';
      $('#mfC').focus();
      var go=function(){var c=$('#mfC').value.replace(/\D/g,'');if(c.length!==6){$('#mfE').textContent='6자리 숫자를 넣어 주세요';return;}
        sb.auth.mfa.challengeAndVerify({factorId:factorId,code:c}).then(function(x){if(x.error){$('#mfE').textContent='숫자가 맞지 않아요. 다시 넣어 주세요';return;}done();});};
      $('#mfGo').onclick=go;$('#mfC').onkeydown=function(e){if(e.key==='Enter')go();};
    };
    if(ok.length){codeForm(ok[0].id,'<h1>2단계 인증</h1><p>관리자 화면은 인증 앱 확인을 한 번 더 거쳐요.</p>');return;}
    var stale=all.filter(function(f){return f.status!=='verified';});
    return Promise.all(stale.map(function(f){return sb.auth.mfa.unenroll({factorId:f.id});})).then(function(){
      return sb.auth.mfa.enroll({factorType:'totp',friendlyName:'CHA&I 관리 '+Date.now()});
    }).then(function(e){if(e.error)throw e.error;
      codeForm(e.data.id,'<h1>2단계 인증 등록</h1><p>관리자 화면을 지키기 위해 처음 한 번 등록해요. 휴대폰의 인증 앱(Google Authenticator, Microsoft Authenticator 등)으로 아래 QR을 찍어 주세요.</p><p><img alt="2단계 인증 QR 코드" src="'+esc(e.data.totp.qr_code)+'" width="200" height="200" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px"></p><p class="small">QR이 안 되면 이 키를 직접 넣어요: <code>'+esc(e.data.totp.secret)+'</code></p>');
    });
  }).catch(function(){$('#root').innerHTML='<div class="gate"><h1>2단계 인증</h1><p>인증 화면을 불러오지 못했어요. Supabase에서 MFA(TOTP)가 켜져 있는지 확인해 주세요.</p></div>';});
}
/* ── 시작: 로그인·운영자 확인 ── */
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
  if(!s){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자 계정으로 로그인해 주세요.</p><p><a class="btn p" href="/login">로그인</a></p></div>';return;}
  TOKEN=s.access_token;ME=s.user;
  return api('me').then(function(me){
    if(!me||!me.ok){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자만 볼 수 있는 화면이에요.</p><p><a class="btn" href="/my">내 학습으로</a></p></div>';return;}
    if(me.mfa&&me.aal!=='aal2')return mfaGate();
    return start();
  });
}).catch(function(){$('#root').innerHTML='<div class="gate"><p>불러오지 못했어요. 새로고침해 주세요.</p></div>';});
function start(){
  return Promise.all([api('courses'),fetch('/shop/catalog.json').then(function(x){return x.json();}).catch(function(){return {items:{}};}),Promise.resolve(null)]).then(function(v){v[2]=v[0];
    if(!v[0]||!v[0].ok){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자만 볼 수 있는 화면이에요.</p><p><a class="btn" href="/my">내 학습으로</a></p></div>';return;}
    SHOP=(v[1]&&v[1].items)||{};COURSES=(v[2]&&v[2].courses)||[];shell();route();
  });
}
sb.auth.onAuthStateChange(function(ev,s){if(s)TOKEN=s.access_token;});
})();
