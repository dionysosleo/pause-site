function kst(t){return new Date(Date.parse(t)+9*3600e3);}
function pad(n){return (n<10?'0':'')+n;}
function bkey(d,g){ /* d: KST 기준 Date(UTC 값으로 읽음) */
  if(g==='y')return ''+d.getUTCFullYear();
  if(g==='m')return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);
  if(g==='w'){d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-((d.getUTCDay()+6)%7)));}
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function buckets(g,n){ /* 지금 칸을 포함해 뒤로 n칸 */
  var now=kst(new Date().toISOString()),out=[],y=now.getUTCFullYear(),mo=now.getUTCMonth(),da=now.getUTCDate();
  for(var i=n-1;i>=0;i--){var d;
    if(g==='y')d=new Date(Date.UTC(y-i,0,1));else if(g==='m')d=new Date(Date.UTC(y,mo-i,1));else if(g==='w')d=new Date(Date.UTC(y,mo,da-((now.getUTCDay()+6)%7)-7*i));else d=new Date(Date.UTC(y,mo,da-i));
    out.push({k:bkey(d,g),d:d});}
  return out;}
function blabel(b,g,full){var d=b.d;
  if(g==='y')return d.getUTCFullYear()+(full?'년':'');
  if(g==='m')return full?d.getUTCFullYear()+'년 '+(d.getUTCMonth()+1)+'월':(d.getUTCMonth()===0?String(d.getUTCFullYear()).slice(2)+'.':'')+(d.getUTCMonth()+1)+'월';
  if(g==='w')return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+(full?' 주 (월요일 시작)':'');
  return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+(full?' ('+'일월화수목금토'[d.getUTCDay()]+')':'');}
function shortWon(n){var a=Math.abs(n);return a>=1e8?(Math.round(n/1e7)/10)+'억':a>=1e4?(Math.round(n/1e3)/10).toString().replace(/\.0$/,'')+'만':String(Math.round(n));}
function fmtM(v,t){return t==='won'?won(Math.round(v)):t==='ppl'?Math.round(v).toLocaleString('ko-KR')+'명':Math.round(v).toLocaleString('ko-KR')+'건';}
function niceMax(v){if(v<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e;}

/* 기간별 집계 */
function aggregate(D,g){
  var n=GR[g].n,all=buckets(g,n*2),cur=all.slice(n),idx={};all.forEach(function(b,i){idx[b.k]=i;});
  var z=function(){return all.map(function(){return 0;});};
  var A={gross:z(),refund:z(),orders:z(),signup:z(),learners:all.map(function(){return {};}),done:z()};
  var O=D.orders.filter(function(o){return REV[o.status]&&(DASH.test||!o.test)&&(!DASH.cat||o.cat===DASH.cat);});
  O.forEach(function(o){if(!o.paid)return;var i=idx[bkey(kst(o.paid),g)];if(i!=null){A.gross[i]+=o.amount;A.orders[i]++;}
    if(o.refund){var j=idx[bkey(kst(o.refunded||o.paid),g)];if(j!=null)A.refund[j]+=o.refund;}});
  D.members.forEach(function(p){var i=idx[bkey(kst(p.at),g)];if(i!=null)A.signup[i]++;});
  D.progress.forEach(function(x){var i=idx[bkey(kst(x.at),g)];if(i!=null)A.learners[i][x.u]=1;if(x.done){var j=idx[bkey(kst(x.done),g)];if(j!=null)A.done[j]++;}});
  A.net=all.map(function(_,i){return A.gross[i]-A.refund[i];});
  A.aov=all.map(function(_,i){return A.orders[i]?A.gross[i]/A.orders[i]:0;});
  var sum=function(a,from,to){var s=0;for(var i=from;i<to;i++)s+=a[i];return s;};
  var tot=function(from,to){var o={};['gross','refund','orders','signup','net','done'].forEach(function(k){o[k]=sum(A[k],from,to);});o.aov=o.orders?o.gross/o.orders:0;
    var u={};for(var i=from;i<to;i++)Object.assign(u,A.learners[i]);o.learners=Object.keys(u).length;return o;};
  /* 기간 안 주문(상품·결제수단 분석용) */
  var start=cur[0].k, inCur=function(t){return t&&bkey(kst(t),g)>=start;};
  var cut=function(a){return a.slice(n);};
  var series={};['gross','refund','orders','signup','net','aov','done'].forEach(function(k){series[k]=cut(A[k]);});
  series.learners=cut(A.learners).map(function(o){return Object.keys(o).length;});
  return {b:cur,series:series,cur:tot(n,n*2),prev:tot(0,n),orders:O.filter(function(o){return inCur(o.paid);}),members:D.members.filter(function(p){return inCur(p.at);})};
}
function delta(c,p,bad){
  if(!p)return c?'<em class="dl up'+(bad?' bad':'')+'">새로 생김</em>':'<em class="dl">변화 없음</em>';
  var r=(c-p)/p*100,up=r>=0,cls=Math.abs(r)<0.5?'':(up!==!!bad?'good':'bad');
  return '<em class="dl '+cls+'">'+(Math.abs(r)<0.5?'':up?'▲ ':'▼ ')+Math.abs(r).toFixed(Math.abs(r)<10?1:0)+'%</em>';}
function spark(v){var W=96,H=28,m=Math.max.apply(null,v.concat([1])),st=W/Math.max(v.length-1,1);
  return '<svg class="spk" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+v.map(function(x,i){return (i?'L':'M')+(i*st).toFixed(1)+' '+(H-2-(x/m)*(H-4)).toFixed(1);}).join('')+'"/></svg>';}

      if((n-1-i)%step===0)h+='<text class="ax" x="'+(pl+cw*i+cw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>';});

    h+='<line class="hv" x1="0" x2="0" y1="'+pt+'" y2="'+(pt+ih)+'" visibility="hidden"/>';

    host.innerHTML=h+'</svg><div class="tip" hidden></div>';

function memberTable(el,d,call,reload){
  if(!d.members.length){el.innerHTML='<div class="empty">구성원이 없어요. 이메일로 초대하면 같은 이메일로 가입할 때 자동으로 연결돼요.</div>';return;}

    return '<tr><td>'+esc(mb.name||'-')+(mb.dept?' <span class="muted small">'+esc(mb.dept)+'</span>':'')+'<div class="small muted">'+esc(mb.email)+'</div></td><td>'+(mb.status==='active'?tag('가입 완료','green'):tag('초대함','amber'))+'</td>'+

      '<td class="num"><select class="btn s" data-as="'+mb.id+'"><option value="">강의 배정</option>'+d.seats.filter(function(s){return !mb.assigned.some(function(a){return a.seat_id===s.id;});}).map(function(s){return '<option value="'+s.id+'"'+(s.used>=s.total?' disabled':'')+'>'+esc(courseName(s.course_id))+' ('+(s.total-s.used)+' 남음)</option>';}).join('')+'</select> <button class="btn s" data-rm="'+mb.id+'">빼기</button></td></tr>';}).join('')+'</tbody></table></div>';

var tusLoad=null;

function uploadVideo(file,title,onProgress){
  return Promise.all([loadTus(),act({action:'video_init',title:title})]).then(function(v){var t=v[1];
    return new Promise(function(ok,no){
      var up=new window.tus.Upload(file,{endpoint:t.endpoint,retryDelays:[0,3000,5000,10000,20000],
        headers:{AuthorizationSignature:t.signature,AuthorizationExpire:String(t.expire),VideoId:t.videoId,LibraryId:String(t.libraryId)},
        metadata:{filetype:file.type,title:title},
        onError:function(e){no(e);},onProgress:function(a,b){onProgress(Math.round(100*a/b));},onSuccess:function(){ok(t.videoId);}});
      up.findPreviousUploads().then(function(p){if(p.length)up.resumeFromPreviousUpload(p[0]);up.start();});
    });
  });
}

      $('#tpC').onclick=function(){try{navigator.clipboard.writeText(pw).then(function(){toast('복사했어요');});}catch(e){}};};
    var perms=function(cur,lbl){return '<label>역할<select id="aP"><option value="">직접 고르기</option>'+Object.keys(P).map(function(k){return '<option value="'+k+'"'+(lbl===P[k].label?' selected':'')+'>'+esc(P[k].label)+'</option>';}).join('')+'</select></label>'+
      '<div id="aBox" class="bar">'+Object.keys(N).map(function(p){return '<label class="ck"><input type="checkbox" class="aC" value="'+p+'"'+(cur.indexOf(p)>=0||cur.indexOf('all')>=0?' checked':'')+'> '+N[p]+'</label>';}).join('')+'</div>'+
      '<label>표시 이름 (선택)<input id="aL" value="'+esc(lbl||'')+'" placeholder="예: 기업강의 담당"></label>';};
    var bindPerms=function(){$('#aP').onchange=function(){var k=$('#aP').value;if(!k)return;var ps=P[k].perms;$$('.aC').forEach(function(c){c.checked=ps[0]==='all'||ps.indexOf(c.value)>=0;});$('#aL').value=P[k].label;};};
    var picked=function(){var k=$('#aP').value;return k==='owner'?['all']:$$('.aC').filter(function(c){return c.checked;}).map(function(c){return c.value;});};
    $('#aNew').onclick=function(){
      openDlg('<h3>관리자 전용 계정 만들기</h3><div class="f"><div class="row"><label>이름<input id="aN" maxlength="40" placeholder="예: 한성희"></label><label>관리자용 이메일<input id="aE" type="email" placeholder="예: admin-han@chaand.ai"></label></div>'+perms([],'')+'<p class="small muted" style="margin:0">사이트에서 수강할 때 쓰는 이메일과 다른 주소여야 해요.</p><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="aGo">만들기</button></div></div>');
      bindPerms();
      $('#aGo').onclick=function(){var nm=$('#aN').value.trim(),em=$('#aE').value.trim(),ps=picked();
        if(!nm){toast('이름을 넣어 주세요');$('#aN').focus();return;}if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast('이메일 형식을 확인해 주세요');$('#aE').focus();return;}if(!ps.length){toast('역할을 고르거나 권한을 하나 이상 체크해 주세요');return;}
        var b=this;b.disabled=true;act({action:'admin_save',name:$('#aN').value.trim(),email:$('#aE').value.trim(),perms:picked(),label:$('#aL').value.trim(),preset:$('#aP').value||undefined}).then(function(r){V.settings(m,'admins');showTemp(r.email,r.tempPassword);},function(){b.disabled=false;});};};
    $$('[data-ae]',box).forEach(function(b){b.onclick=function(){var a=d.admins.find(function(x){return x.user_id===b.getAttribute('data-ae');});
      openDlg('<h3>권한 바꾸기 · '+esc(a.name||a.email||'')+'</h3><div class="f">'+perms(a.perms||[],a.label||'')+'<div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="aGo">저장</button></div></div>');bindPerms();
      $('#aGo').onclick=function(){act({action:'admin_save',userId:a.user_id,perms:picked(),label:$('#aL').value.trim(),preset:$('#aP').value||undefined}).then(function(){closeDlg();toast('저장했어요');V.settings(m,'admins');});};};});
    $$('[data-rp]',box).forEach(function(b){b.onclick=function(){var a=d.admins.find(function(x){return x.user_id===b.getAttribute('data-rp');});if(!confirmTxt((a.name||a.email)+'님의 비밀번호를 임시 비밀번호로 바꿀까요? 지금 비밀번호는 더 이상 안 돼요.'))return;
      act({action:'staff_reset',userId:a.user_id}).then(function(r){V.settings(m,'admins');showTemp(a.email,r.tempPassword);});};});
    $$('[data-ar]',box).forEach(function(b){b.onclick=function(){if(!confirmTxt('이 관리자를 뺄까요? 관리자 전용 계정이면 계정도 지워져요.'))return;act({action:'admin_remove',userId:b.getAttribute('data-ar')}).then(function(){toast('뺐어요');V.settings(m,'admins');});};});
  });
  if(sub==='backup')return api('backups').then(function(d){
    box.innerHTML='<p class="sub">매주 일요일 새벽에 주요 표(회원·주문·수강권·기업·문의·할인 등)를 묶어 비공개 저장소에 자동으로 백업하고, 최근 8개만 남겨요. 같은 Supabase 안에 있으니 한 달에 한 번은 내려받아 따로 보관해 주세요.</p><p><button class="btn p" id="bNow">지금 백업하기</button></p>'+
      (d.backups.length?'<div class="tw"><table><thead><tr><th>파일</th><th>만든 때</th><th class="num">크기</th><th></th></tr></thead><tbody>'+d.backups.map(function(x){return '<tr><td>'+esc(x.name)+'</td><td>'+dt(x.at)+'</td><td class="num">'+(x.size?Math.max(1,Math.round(x.size/1024))+'KB':'')+'</td><td class="num"><button class="btn s" data-bg="'+esc(x.name)+'">내려받기</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">아직 백업이 없어요</div>');
    $('#bNow').onclick=function(){var b=this;b.disabled=true;b.textContent='백업하는 중이에요';act({action:'backup_now'}).then(function(r){toast('백업했어요 ('+Math.round(r.bytes/1024)+'KB)');V.settings(m,'backup');},function(){b.disabled=false;b.textContent='지금 백업하기';});};
    $$('[data-bg]',box).forEach(function(b){b.onclick=function(){act({action:'backup_get',name:b.getAttribute('data-bg')}).then(function(r){if(r.url)location.href=r.url;});};});
  });
  return api('launch').then(function(d){var G={};d.checks.forEach(function(c){(G[c.group]=G[c.group]||[]).push(c);});var ok=d.checks.filter(function(c){return c.ok;}).length;
    box.innerHTML='<p class="sub">실서버로 열기 전에 하나씩 초록색으로 만들어 주세요. '+ok+'/'+d.checks.length+' 준비됨.</p>'+Object.keys(G).map(function(g){return '<h2>'+esc(g)+'</h2><ul class="rl box">'+G[g].map(function(c){return '<li><div><b>'+(c.ok?'✓ ':'· ')+esc(c.name)+'</b><div class="small muted">'+esc(c.note)+'</div></div><div>'+tag(c.ok?'준비됨':'확인 필요',c.ok?'green':'amber')+'</div></li>';}).join('')+'</ul>';}).join('')+
      '<h2>테스트 데이터 정리</h2><div class="box"><p class="small" style="margin-top:0">테스트 결제로 생긴 주문과 그 주문의 수강권을 지워요. 실제 결제는 지우지 않아요. 운영 키로 바꾼 뒤, 출시 직전에 한 번 눌러 주세요.</p><button class="btn d" id="pT">테스트 주문 지우기</button></div>';
    $('#pT').onclick=function(){if(!confirmTxt('테스트 결제 주문과 그 수강권을 모두 지울까요? 되돌릴 수 없어요.'))return;act({action:'purge_test',confirm:'delete-test'}).then(function(r){toast(r.deleted+'건 지웠어요');V.settings(m,'launch');});};
  });
};
/* ── 강의별 파일 키트 (비공개 저장소, 수강생·키트 구매자만 내려받기) ── */
function kitSection(m,courses){api('kits').then(function(d){
  courses.forEach(function(c){var host=$('[data-kits="'+c.id+'"]',m);if(!host)return;var ks=d.kits.filter(function(k){return k.course_id===c.id;});
    host.innerHTML='<div class="bar" style="justify-content:space-between;margin:14px 0 6px"><b class="small">키트 파일 '+ks.length+'개</b><label class="btn s">파일 올리기<input type="file" hidden data-kup="'+esc(c.id)+'"></label></div>'+(ks.length?'<ul class="rl">'+ks.map(function(k){return '<li><div>'+esc(k.title)+'<div class="small muted">'+esc(k.file_name||'')+(k.size_b?' · '+Math.max(1,Math.round(k.size_b/1024))+'KB':'')+'</div></div><button class="btn s" data-kdel="'+k.id+'">지우기</button></li>';}).join('')+'</ul>':'<p class="small muted" style="margin:0">아직 없어요. 수강생은 내 학습과 강의 화면에서 내려받아요.</p>');});
  $$('[data-kup]',m).forEach(function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;if(f.size>500*1048576){toast('500MB까지 올릴 수 있어요');return;}
    var cid=inp.getAttribute('data-kup'),title=window.prompt('수강생에게 보일 이름',f.name.replace(/\.[^.]+$/,''));if(title===null)return;
    toast('올리는 중이에요');act({action:'kit_upload',courseId:cid,fileName:f.name}).then(function(u){
      return fetch(u.url,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream','x-upsert':'false'},body:f}).then(function(r){if(!r.ok)throw new Error('upload');
        return act({action:'kit_save',courseId:cid,path:u.path,title:title||f.name,fileName:f.name,size:f.size});});
    }).then(function(){toast('올렸어요');kitSection(m,courses);},function(){toast('올리지 못했어요. 다시 해 주세요.');});};});
  $$('[data-kdel]',m).forEach(function(b){b.onclick=function(){if(!confirmTxt('이 키트 파일을 지울까요? 수강생도 더 이상 받을 수 없어요.'))return;act({action:'kit_delete',id:+b.getAttribute('data-kdel')}).then(function(){toast('지웠어요');kitSection(m,courses);});};});
});}

/* ── 시작: 로그인·운영자 확인 ── */
/* ── 관리자 로그인 (관리자 전용 계정: 이메일·비밀번호만) ── */
function loginGate(msg){
  $('#root').innerHTML='<div class="gate" style="text-align:left"><h1 style="text-align:center">CHA&amp;I 관리</h1><p style="text-align:center">관리자 전용 계정으로 로그인해 주세요.<br><span class="small">사이트 회원 계정이나 카카오·구글 로그인은 쓸 수 없어요.</span></p>'+
    '<form class="f box" id="lg" autocomplete="on"><label>이메일<input id="lgE" type="email" autocomplete="username" required></label><label>비밀번호<input id="lgP" type="password" autocomplete="current-password" required></label><p class="small" id="lgM" style="margin:0;color:var(--red)">'+esc(msg||'')+'</p><button class="btn p" id="lgGo">로그인</button></form>'+
    '<p class="small muted" style="text-align:center">비밀번호를 잊었으면 대표 관리자에게 임시 비밀번호를 다시 받아 주세요.</p></div>';
  $('#lg').onsubmit=function(e){e.preventDefault();var b=$('#lgGo');b.disabled=true;$('#lgM').textContent='';
    sb.auth.signInWithPassword({email:$('#lgE').value.trim(),password:$('#lgP').value}).then(function(r){
      if(r.error){b.disabled=false;$('#lgM').textContent='이메일 또는 비밀번호가 맞지 않아요.';return;}
      boot();});};
}
function pwChange(first){
  var html='<h3>'+(first?'새 비밀번호 정하기':'비밀번호 바꾸기')+'</h3><div class="f">'+(first?'<p style="margin:0">임시 비밀번호로 처음 로그인했어요. 다른 곳에서 쓰지 않는 새 비밀번호를 정해 주세요.</p>':'')+
    '<label>새 비밀번호 (8자 이상)<input id="np1" type="password" autocomplete="new-password"></label><label>한 번 더<input id="np2" type="password" autocomplete="new-password"></label><div class="acts">'+(first?'':'<button class="btn" data-close>닫기</button>')+'<button class="btn p" id="npGo">바꾸기</button></div></div>';
  if(first){$('#root').innerHTML='<div class="gate" style="text-align:left"><div class="box">'+html+'</div></div>';}else openDlg(html);
  $('#npGo').onclick=function(){var a=$('#np1').value,b2=$('#np2').value;if(a.length<8){toast('8자 이상으로 정해 주세요');return;}if(a!==b2){toast('두 번 넣은 비밀번호가 달라요');return;}
    var btn=this;btn.disabled=true;sb.auth.updateUser({password:a}).then(function(r){if(r.error){btn.disabled=false;toast(/same/i.test(r.error.message)?'임시 비밀번호와 다른 비밀번호로 정해 주세요':'바꾸지 못했어요 ('+r.error.message+')');return;}
      return act({action:'pw_changed'}).then(function(){return sb.auth.refreshSession();}).then(function(){toast('비밀번호를 바꿨어요');if(first)boot();else closeDlg();});});};
}
function boot(){
  return sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
    if(!s)return loginGate();
    TOKEN=s.access_token;ME=s.user;
    return api('me').then(function(me){
      if(me&&me.code==='WRONG_HOST'&&me.host){location.replace('https://'+me.host+'/');return;}
      if(!me||!me.ok){return sb.auth.signOut({scope:'local'}).then(function(){loginGate('관리자 전용 계정이 아니에요. 관리자 화면은 관리자 전용 계정으로만 들어올 수 있어요.');});}
      if(me.mustChange)return pwChange(true);
      if(me.mfa&&me.aal!=='aal2')return mfaGate();
      PERMS=me.perms||[];ME_LABEL=(me.name?me.name+' · ':'')+(me.label||'')+(me.legacy?' (임시: 사이트 회원 계정)':'');
      return Promise.all([can('courses')?api('courses').catch(function(){return {};}):Promise.resolve({}),fetch('/shop/catalog.json').then(function(x){return x.json();}).catch(function(){return {items:{}};})]).then(function(v){
        SHOP=(v[1]&&v[1].items)||{};COURSES=(v[0]&&v[0].courses)||[];shell();route();
        if(me.legacy)toast('지금은 사이트 회원 계정으로 들어왔어요. 설정 → 관리자 권한에서 관리자 전용 계정을 만들어 주세요.');
      });
    });
  }).catch(function(){$('#root').innerHTML='<div class="gate"><p>불러오지 못했어요. 새로고침해 주세요.</p></div>';});
}
/* admin.chaand.ai 를 쓰기 시작했으면 본 사이트의 /admin 은 그쪽으로 보냄 */
fetch('/api/payments/config',{cache:'no-store'}).then(function(x){return x.json();}).catch(function(){return {};}).then(function(c){
  if(c&&c.adminHost&&location.host!==c.adminHost&&/(^|\.)chaand\.ai$/.test(location.host)){location.replace('https://'+c.adminHost+'/');return;}
  boot();
});
function start(){boot();}
sb.auth.onAuthStateChange(function(ev,s){if(s)TOKEN=s.access_token;});
})();
</script></body></html>
