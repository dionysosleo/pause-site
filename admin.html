<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>관리 — CHA&amp;I</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#26313D;--mut:#6B727A;--line:#E3E6EA;--soft:#F3F4F2;--bg:#FAFAF8;--sage:#546C5D;--red:#B42318;--amber:#9A6700}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-size:17px;letter-spacing:.2em;text-decoration:none;padding:0 10px 18px;display:flex;align-items:center;gap:8px}.logo small{letter-spacing:0;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 12px;border-radius:10px;text-decoration:none;color:var(--mut);font-weight:600}
.nav a[aria-current]{background:var(--soft);color:var(--ink)}.nav a:hover{color:var(--ink)}
.nav .dot{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.side .who{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--mut);word-break:break-all}.side .who a{display:inline-block;margin-top:6px}
main{padding:28px clamp(16px,3vw,40px) 80px;max-width:1180px;width:100%}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px;font-size:14px}
h2{font-size:17px;margin:28px 0 12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card b{display:block;font-size:24px;line-height:1.2;margin-top:4px}.card span{font-size:13px;color:var(--mut)}
.card.todo{cursor:pointer}.card.todo b{color:var(--red)}.card.todo.zero b{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.bar input[type=search],.bar select{height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 12px;min-width:0}
.bar input[type=search]{flex:1 1 220px}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
thead th{border-top:0;background:var(--soft);font-size:13px;color:var(--mut);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:#FBFBFA}
.muted{color:var(--mut)}.small{font-size:13px}.nowrap{white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:600;white-space:nowrap}
.tag.red{background:#FDECEA;color:var(--red)}.tag.green{background:#E7F0EA;color:var(--sage)}.tag.amber{background:#FFF4DB;color:var(--amber)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}.btn.d{background:var(--red);border-color:var(--red);color:#fff}.btn.s{height:30px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.box h3{margin:0 0 12px;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}
.pbar{width:90px;height:6px;border-radius:999px;background:var(--soft);display:inline-block;vertical-align:middle;overflow:hidden;margin-right:6px}.pbar i{display:block;height:100%;background:var(--sage)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut);text-decoration:none;font-size:14px;margin-bottom:10px;cursor:pointer;background:none;border:0;padding:0}
dialog{border:0;border-radius:20px;padding:24px;width:min(520px,calc(100% - 32px));box-shadow:0 20px 60px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(20,24,28,.45)}
dialog h3{margin:0 0 14px;font-size:18px}
.f{display:grid;gap:12px}.f label{display:grid;gap:5px;font-size:14px;font-weight:600}.f label.ck{display:flex;align-items:center;gap:8px;font-weight:400}
.f input:not([type=checkbox]),.f select,.f textarea{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-weight:400}.f textarea{height:auto;min-height:110px;padding:10px 12px}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-size:14px}
.gate{max-width:420px;margin:15vh auto;text-align:center}.gate p{color:var(--mut)}
.mtabs{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}.side{display:none}
  .mtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .mtabs a{flex:none;height:34px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;text-decoration:none;color:var(--mut);font-weight:600;font-size:14px}.mtabs a[aria-current]{background:var(--ink);color:#fff}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}
  .tw{overflow-x:auto}table{min-width:640px}
}
</style></head><body>

function memberTable(el,d,call,reload){
  if(!d.members.length){el.innerHTML='<div class="empty">구성원이 없어요. 이메일로 초대하면 같은 이메일로 가입할 때 자동으로 연결돼요.</div>';return;}
  el.innerHTML='<div class="tw"><table><thead><tr><th>구성원</th><th>상태</th><th>배정된 강의 · 진도</th><th></th></tr></thead><tbody>'+d.members.map(function(mb){
    return '<tr><td>'+esc(mb.name||'-')+(mb.dept?' <span class="muted small">'+esc(mb.dept)+'</span>':'')+'<div class="small muted">'+esc(mb.email)+'</div></td><td>'+(mb.status==='active'?tag('가입 완료','green'):tag('초대함','amber'))+'</td>'+
      '<td>'+(mb.assigned.length?mb.assigned.map(function(a){return '<div class="small nowrap">'+esc(courseName(a.course_id))+' '+(mb.status==='active'?pbar(a.pct)+(a.done?' '+tag('수료','green'):''):'<span class="muted">가입 전</span>')+' <button class="btn s" data-un="'+mb.id+':'+a.seat_id+'">회수</button></div>';}).join(''):'<span class="muted small">없음</span>')+'</td>'+
      '<td class="num"><select class="btn s" data-as="'+mb.id+'"><option value="">강의 배정</option>'+d.seats.filter(function(s){return !mb.assigned.some(function(a){return a.seat_id===s.id;});}).map(function(s){return '<option value="'+s.id+'"'+(s.used>=s.total?' disabled':'')+'>'+esc(courseName(s.course_id))+' ('+(s.total-s.used)+' 남음)</option>';}).join('')+'</select> <button class="btn s" data-rm="'+mb.id+'">빼기</button></td></tr>';}).join('')+'</tbody></table></div>';
  $$('[data-as]',el).forEach(function(s){s.onchange=function(){if(!s.value)return;call({action:'assign',memberId:+s.getAttribute('data-as'),seatId:+s.value}).then(function(){toast('배정했어요');reload();},function(){s.value='';});};});
  $$('[data-un]',el).forEach(function(b){b.onclick=function(){var v=b.getAttribute('data-un').split(':');if(!confirmTxt('이 강의 배정을 회수할까요?'))return;call({action:'unassign',memberId:+v[0],seatId:+v[1]}).then(function(){toast('회수했어요');reload();});};});
  $$('[data-rm]',el).forEach(function(b){b.onclick=function(){if(!confirmTxt('구성원에서 뺄까요? 배정된 강의도 모두 회수돼요.'))return;call({action:'remove',memberId:+b.getAttribute('data-rm')}).then(function(){toast('뺐어요');reload();});};});
}

  $$('[data-open]',m).forEach(function(b){b.onclick=function(){var o=b.getAttribute('data-v')==='1';if(!confirmTxt(o?'강의를 열까요? 오늘이 이 강의 수강생 모두의 수강 시작일이 돼요.':'강의를 닫을까요? 수강생이 볼 수 없게 돼요.'))return;act({action:'course_open',courseId:b.getAttribute('data-open'),open:o}).then(function(){toast(o?'강의를 열었어요':'강의를 닫았어요');V.courses(m);});};});

V.ship=function(m){api('shipments').then(function(d){var L=d.orders;
  var wait=L.filter(function(o){return !o.shipped_at;}),done=L.filter(function(o){return o.shipped_at;});
  var row=function(o){return '<tr><td class="nowrap">'+day(o.paid_at)+'</td><td>'+esc(itemName(o.item_id))+(o.is_test?' '+tag('테스트'):'')+'<div class="small muted">'+esc(o.buyer_email)+'</div></td>'+
    '<td>'+(o.ship_addr?esc(o.ship_name)+' · '+esc(o.ship_phone)+'<div class="small">'+esc(o.ship_addr)+'</div>'+(o.ship_memo?'<div class="small muted">'+esc(o.ship_memo)+'</div>':''):tag('배송지 미입력','red'))+'</td>'+
    '<td>'+(o.shipped_at?dt(o.shipped_at)+(o.ship_tracking?'<div class="small muted">'+esc(o.ship_tracking)+'</div>':''):'')+'</td><td class="num">'+(o.shipped_at?'<button class="btn s" data-undo="'+esc(o.id)+'">발송 취소</button>':(o.ship_addr?'<button class="btn s p" data-sh="'+esc(o.id)+'">발송 처리</button>':''))+'</td></tr>';};
  var tbl=function(rows){return rows.length?'<div class="tw"><table><thead><tr><th>결제일</th><th>주문</th><th>배송지</th><th>발송</th><th></th></tr></thead><tbody>'+rows.map(row).join('')+'</tbody></table></div>':'<div class="empty">없어요</div>';};
  m.innerHTML='<h1>키트 발송</h1><p class="sub">고객은 내 학습 → 주문 내역에서 배송지를 넣어요. 배송 정보는 발송 후 3개월이 지나면 지워 주세요(개인정보처리방침).</p><h2>발송 대기 '+wait.length+'건</h2>'+tbl(wait)+'<h2>발송 완료 '+done.length+'건</h2>'+tbl(done);
  $$('[data-sh]',m).forEach(function(b){b.onclick=function(){openDlg('<h3>발송 처리</h3><div class="f"><label>택배사·송장번호 (선택)<input id="tN" placeholder="예: CJ 1234-5678-9012"></label><div class="acts"><button class="btn" data-close>닫기</button><button class="btn p" id="tGo">발송했어요</button></div></div>');
    $('#tGo').onclick=function(){act({action:'shipped',orderId:b.getAttribute('data-sh'),tracking:$('#tN').value}).then(function(){closeDlg();toast('발송 처리했어요');V.ship(m);});};};});
  $$('[data-undo]',m).forEach(function(b){b.onclick=function(){if(!confirmTxt('발송 처리를 취소할까요?'))return;act({action:'shipped',orderId:b.getAttribute('data-undo'),undo:true}).then(function(){V.ship(m);});};});
});};


/* ── 작업 기록 ── */
var ACTN={refund:'환불',grant:'수강권 부여',revoke:'수강권 회수',company_create:'기업 등록',company_admin:'담당자 지정',seat_add:'수강권 묶음 추가',company_invite:'구성원 초대',company_assign:'강의 배정',company_unassign:'배정 회수',company_remove:'구성원 빼기',course_open:'강의 열기·닫기',lesson_save:'편 저장',lesson_delete:'편 삭제',video_init:'영상 업로드',shipped:'발송 처리'};
V.logs=function(m){api('logs').then(function(d){var L=d.logs;
  m.innerHTML='<h1>작업 기록</h1><p class="sub">운영자가 한 일(환불, 수강권, 기업, 강의, 발송)이 자동으로 남아요. 분쟁이 생기면 근거가 돼요.</p>'+(L.length?'<div class="tw"><table><thead><tr><th>시각</th><th>운영자</th><th>작업</th><th>대상</th><th>내용</th></tr></thead><tbody>'+L.map(function(x){
    var dd=x.detail||{},keys=Object.keys(dd).filter(function(k){return dd[k]!==''&&dd[k]!=null&&typeof dd[k]!=='object';}).slice(0,5);
    return '<tr><td class="nowrap">'+dt(x.created_at)+'</td><td class="small">'+esc(x.email||'')+'</td><td>'+tag(ACTN[x.action]||x.action)+'</td><td class="small">'+esc(x.target||'')+'</td><td class="small muted">'+keys.map(function(k){return esc(k)+': '+esc(String(dd[k]).slice(0,60));}).join(' · ')+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">아직 기록이 없어요</div>');
});};
/* ── 주문 엑셀(CSV) 내보내기: 세무·정산용 ── */
function exportCsv(){api('orders_csv').then(function(d){
  var st={paid:'결제 완료',partial_refunded:'일부 환불',refunded:'환불 완료',canceled:'취소'};
  var rows=[['결제일','주문번호','상품','수량','결제 금액','환불 금액','순매출','상태','테스트','주문자','이메일','결제 수단','환불일','환불 사유']].concat(d.orders.map(function(o){return [o.paid_at?new Date(o.paid_at).toLocaleString('ko-KR'):'',o.id,itemName(o.item_id),o.qty,o.amount,o.refund_amount||0,o.amount-(o.refund_amount||0),st[o.status]||o.status,o.is_test?'예':'',o.buyer_name||'',o.buyer_email,o.method||'',o.refunded_at?new Date(o.refunded_at).toLocaleString('ko-KR'):'',o.refund_reason||''];}));
  var csv='﻿'+rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='chaand-orders-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();toast(d.orders.length+'건을 내보냈어요');
});}
/* ── 영상 업로드: 브라우저 → Bunny로 바로(TUS). 서버는 서명만 줌 ── */
var tusLoad=null;
function loadTus(){if(window.tus)return Promise.resolve();if(tusLoad)return tusLoad;tusLoad=new Promise(function(ok,no){var s=document.createElement('script');s.src='/vendor/tus-4.3.1.min.js';s.onload=ok;s.onerror=function(){tusLoad=null;no();};document.head.appendChild(s);});return tusLoad;}
function uploadVideo(file,title,onProgress){
  return Promise.all([loadTus(),act({action:'video_init',title:title})]).then(function(v){var t=v[1];
    return new Promise(function(ok,no){
      var up=new window.tus.Upload(file,{endpoint:t.endpoint,retryDelays:[0,3000,5000,10000,20000],
        headers:{AuthorizationSignature:t.signature,AuthorizationExpire:String(t.expire),VideoId:t.videoId,LibraryId:String(t.libraryId)},
        metadata:{filetype:file.type,title:title},
        onError:function(e){no(e);},onProgress:function(a,b){onProgress(Math.round(100*a/b));},onSuccess:function(){ok(t.videoId);}});
      up.findPreviousUploads().then(function(p){if(p.length)up.resumeFromPreviousUpload(p[0]);up.start();});
    });
  });
}
/* ── 2단계 인증 (운영자 필수) ── */
function mfaGate(){
  return sb.auth.mfa.listFactors().then(function(r){
    var all=(r.data&&r.data.all)||[],ok=all.filter(function(f){return f.factor_type==='totp'&&f.status==='verified';});
    var done=function(){return sb.auth.refreshSession().then(function(){location.reload();});};
    var codeForm=function(factorId,head){
      $('#root').innerHTML='<div class="gate">'+head+'<div class="f" style="text-align:left;margin-top:16px"><label>인증 앱의 6자리 숫자<input id="mfC" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="btn p" id="mfGo">확인</button><p class="small muted" id="mfE"></p></div></div>';
      $('#mfC').focus();
      var go=function(){var c=$('#mfC').value.replace(/\D/g,'');if(c.length!==6){$('#mfE').textContent='6자리 숫자를 넣어 주세요';return;}
        sb.auth.mfa.challengeAndVerify({factorId:factorId,code:c}).then(function(x){if(x.error){$('#mfE').textContent='숫자가 맞지 않아요. 다시 넣어 주세요';return;}done();});};
      $('#mfGo').onclick=go;$('#mfC').onkeydown=function(e){if(e.key==='Enter')go();};
    };
    if(ok.length){codeForm(ok[0].id,'<h1>2단계 인증</h1><p>관리자 화면은 인증 앱 확인을 한 번 더 거쳐요.</p>');return;}
    var stale=all.filter(function(f){return f.status!=='verified';});
    return Promise.all(stale.map(function(f){return sb.auth.mfa.unenroll({factorId:f.id});})).then(function(){
      return sb.auth.mfa.enroll({factorType:'totp',friendlyName:'CHA&I 관리 '+Date.now()});
    }).then(function(e){if(e.error)throw e.error;
      codeForm(e.data.id,'<h1>2단계 인증 등록</h1><p>관리자 화면을 지키기 위해 처음 한 번 등록해요. 휴대폰의 인증 앱(Google Authenticator, Microsoft Authenticator 등)으로 아래 QR을 찍어 주세요.</p><p><img alt="2단계 인증 QR 코드" src="'+esc(e.data.totp.qr_code)+'" width="200" height="200" style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px"></p><p class="small">QR이 안 되면 이 키를 직접 넣어요: <code>'+esc(e.data.totp.secret)+'</code></p>');
    });
  }).catch(function(){$('#root').innerHTML='<div class="gate"><h1>2단계 인증</h1><p>인증 화면을 불러오지 못했어요. Supabase에서 MFA(TOTP)가 켜져 있는지 확인해 주세요.</p></div>';});
}
/* ── 시작: 로그인·운영자 확인 ── */
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;
  if(!s){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자 계정으로 로그인해 주세요.</p><p><a class="btn p" href="/login">로그인</a></p></div>';return;}
  TOKEN=s.access_token;ME=s.user;
  return api('me').then(function(me){
    if(!me||!me.ok){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자만 볼 수 있는 화면이에요.</p><p><a class="btn" href="/my">내 학습으로</a></p></div>';return;}
    if(me.mfa&&me.aal!=='aal2')return mfaGate();
    return start();
  });
}).catch(function(){$('#root').innerHTML='<div class="gate"><p>불러오지 못했어요. 새로고침해 주세요.</p></div>';});
function start(){
  return Promise.all([api('dashboard'),fetch('/shop/catalog.json').then(function(x){return x.json();}).catch(function(){return {items:{}};}),api('courses').catch(function(){return {};})]).then(function(v){
    if(!v[0]||!v[0].ok){$('#root').innerHTML='<div class="gate"><h1>관리</h1><p>운영자만 볼 수 있는 화면이에요.</p><p><a class="btn" href="/my">내 학습으로</a></p></div>';return;}
    SHOP=(v[1]&&v[1].items)||{};COURSES=(v[2]&&v[2].courses)||[];shell();route();
  });
}
sb.auth.onAuthStateChange(function(ev,s){if(s)TOKEN=s.access_token;});
})();
</script></body></html>
