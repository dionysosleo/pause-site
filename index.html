<style>
:root{--ink:#1D1D1B;--ink2:#3A3A36;--muted:#6F6A63;--taupe:#8A847C;--hair:#DEDBD3;--soft:#ECE9E2;--paper:#F0EDE6;--bg:#F5F3EE;--lime:#DBDED8;--lime-t:#E6EAE3;--green:#546C5D;--red:#B42318;--max:1240px;--en:'Cormorant Garamond',Georgia,serif}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-underline-offset:3px}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.en{font-family:var(--en)}
.eyebrow{margin:0 0 12px;font-family:var(--en);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green)}
.dark .eyebrow{color:var(--lime)}
.h1{margin:0;font-size:clamp(36px,6vw,72px);line-height:1.08;font-weight:900;letter-spacing:-.045em}
.h2{margin:0;font-size:clamp(26px,3.6vw,42px);line-height:1.2;font-weight:900;letter-spacing:-.035em}
.h3{margin:0;font-size:20px;line-height:1.35;font-weight:700;letter-spacing:-.02em}
.lead{margin:0;font-size:clamp(16px,1.7vw,19px);line-height:1.75;color:var(--ink2)}
.dark .lead{color:#D6D6D0}
.muted{color:var(--muted)}
.section{padding:88px 0}
.section.tight{padding:56px 0}
.dark{background:var(--ink);color:#fff}
.paper{background:var(--paper)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:13px 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:1.5px solid transparent;line-height:1.2;transition:background .15s,color .15s}
.btn-lime{background:var(--green);color:#fff}.btn-lime:hover{background:var(--ink);color:#fff}
.dark .btn-lime{background:var(--lime);color:var(--ink)}.dark .btn-lime:hover{background:#fff;color:var(--ink)}
.btn-line{background:transparent;color:var(--ink);border-color:var(--ink)}.btn-line:hover{background:var(--ink);color:#fff}
.dark .btn-line{color:#fff;border-color:#fff}.dark .btn-line:hover{background:#fff;color:var(--ink)}
.btn-sm{min-height:42px;padding:9px 18px;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:inline-block;font-family:var(--en);font-size:12px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:999px;background:var(--lime);color:var(--ink);line-height:1.1}
.badge.dk{background:var(--ink);color:#fff}.badge.ln{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.photo{position:relative;overflow:hidden;background:var(--soft)}
.photo img{width:100%;height:100%;object-fit:cover}
.credit{position:absolute;right:8px;bottom:6px;font-size:10px;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.note{font-size:13px;line-height:1.6;color:var(--muted);background:var(--soft);border-radius:10px;padding:12px 14px;margin:0}

/* header */
.hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.hbar{max-width:var(--max);margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:20px}
.brand-hero{position:relative;overflow:hidden;background:var(--bg);padding:clamp(64px,10vw,130px) 20px clamp(56px,8vw,100px);text-align:center}
.brand-hero .bg-amp{position:absolute;left:50%;top:50%;transform:translate(-8%,-58%);font-family:var(--en);font-style:italic;font-size:clamp(300px,42vw,620px);line-height:1;color:var(--lime);pointer-events:none;user-select:none}
.brand-hero .wm{position:relative;margin:0;font-family:var(--en);font-weight:400;font-size:clamp(54px,10vw,132px);letter-spacing:.22em;color:var(--ink);line-height:1;padding-left:.22em}
.brand-hero .wm em{font-style:italic;color:var(--green);letter-spacing:0;font-size:.74em;margin:0 .2em 0 0}
.brand-hero .tg1{position:relative;margin:clamp(28px,4vw,48px) 0 0;font-family:var(--en);font-size:clamp(15px,1.6vw,21px);letter-spacing:.55em;color:var(--muted);padding-left:.55em}
.brand-hero .tg2{position:relative;margin:12px 0 0;font-family:'Noto Serif KR',serif;font-size:clamp(15px,1.5vw,20px);letter-spacing:.35em;color:var(--taupe);padding-left:.35em}
.logo{font-family:var(--en);font-weight:500;font-size:25px;letter-spacing:.2em;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{display:none}
.logo b{font-weight:500}
.logo .amp{font-style:italic;color:var(--green);letter-spacing:0;margin:0 .22em 0 .02em;font-size:1.08em}
.gnb{display:flex;gap:4px;margin:0 0 0 12px;padding:0;list-style:none;flex:1}
.gnb a{display:block;white-space:nowrap;padding:12px 14px;text-decoration:none;font-weight:700;font-size:16px;border-bottom:2px solid transparent}
.gnb a[aria-current="page"]{border-bottom-color:var(--ink)}
.gnb a:hover{color:var(--green)}
.hutil{display:flex;align-items:center;gap:6px;margin-left:auto}
.lnk{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;padding:10px 8px;text-decoration:none;white-space:nowrap}
.lnk:hover{color:var(--ink)}
.burger{display:none;width:44px;height:44px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;cursor:pointer;align-items:center;justify-content:center}
.mnav{display:none;border-top:1px solid var(--hair);padding:8px 24px 16px}
.mnav a{display:block;padding:12px 0;font-weight:700;text-decoration:none;font-size:18px;border-bottom:1px solid var(--hair)}
.mnav.open{display:block}
@media (max-width:900px){.gnb{display:none}.burger{display:inline-flex}.hd .btn-sm{display:none}}
/* 상세 페이지에서도 상단 메뉴는 유지 (R14) */

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);min-height:min(78vh,760px)}
.hero-copy{display:flex;flex-direction:column;justify-content:center;gap:24px;padding:72px 48px 72px max(24px,calc((100vw - var(--max))/2 + 24px))}
.hero .photo{min-height:420px}
.hero .photo>img{position:absolute;inset:0}
.hero-tag{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--muted)}
.hero-about{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ink)}
.hero-about div{padding:14px 16px 0 0}
.hero-about div+div{padding-left:16px;border-left:1px solid var(--hair)}
.hero-about dt{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--green);margin-bottom:6px}
.hero-about dd{margin:0;font-size:14px;line-height:1.55;font-weight:600;color:var(--ink)}
@media (max-width:640px){.hero-about{grid-template-columns:minmax(0,1fr)}.hero-about div,.hero-about div+div{padding:12px 0;border-left:0;border-bottom:1px solid var(--hair)}}
.hero-tag span{width:8px;height:8px;border-radius:50%;background:var(--green)}
.hero-float{position:absolute;left:24px;bottom:24px;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-width:300px;font-size:14px;line-height:1.5}
.hero-float b{display:block;font-family:var(--en);font-size:12px;letter-spacing:.06em;color:var(--green);margin-bottom:4px}
.hero-float .typing::after{content:'▍';animation:blink 1s steps(1) infinite;color:var(--green)}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hero-float .typing::after{animation:none}}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr);min-height:0!important}.hero-copy{padding:40px 24px 48px}.hero .photo{min-height:0;height:min(56vh,420px);order:-1}.hero-float{left:16px;right:16px;bottom:16px;max-width:none}}

/* proof strip */
.proof{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.proof div{padding:22px 20px;border-right:1px solid var(--hair)}
.proof div:last-child{border-right:0}
.proof strong{display:block;font-family:var(--en);font-size:32px;line-height:1.1;letter-spacing:-.03em}
.proof span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.proof{grid-template-columns:repeat(2,minmax(0,1fr))}.proof div:nth-child(2){border-right:0}.proof div:nth-child(-n+2){border-bottom:1px solid var(--hair)}}

/* three doors */
.doors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.door{display:flex;flex-direction:column;text-decoration:none;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--hair);transition:transform .2s,box-shadow .2s}
.door:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(0,0,0,.1)}
.door .photo{aspect-ratio:4/3}
.door-body{padding:22px 22px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.door .no{font-family:var(--en);font-size:13px;font-weight:700;color:var(--green);letter-spacing:.06em}
.door .who{margin-top:auto;padding-top:12px;font-size:14px;font-weight:700}
@media (max-width:900px){.doors{grid-template-columns:minmax(0,1fr)}}

.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:36px}
.sec-head .lead{max-width:560px}

/* split */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.split .photo,.rounded54{aspect-ratio:5/4;border-radius:16px}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr);gap:28px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:s;border-top:1px solid #3A3A3A}
.steps li{list-style:none;padding:24px 20px 8px 0;border-right:1px solid #3A3A3A;margin-right:20px}
.steps li:last-child{border-right:0}
.steps .n{font-family:var(--en);font-size:44px;font-weight:700;color:var(--lime);line-height:1}
.steps h3{margin:12px 0 6px;font-size:18px}
.steps p{margin:0;font-size:15px;color:#CFCFCA;line-height:1.65}
@media (max-width:900px){.steps{grid-template-columns:minmax(0,1fr)}.steps li{border-right:0;border-bottom:1px solid #3A3A3A;margin-right:0}}

/* activity tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.act{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:18px 18px 20px}
.act b{display:block;font-size:17px;margin-bottom:4px}
.act span{font-size:14px;color:var(--muted)}

/* teachers */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:40px;border-top:1px solid #3A3A3A}
.tch{position:relative;padding:32px 0 8px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-width:0}
.tch+.tch::before{content:'';position:absolute;left:-20px;top:0;bottom:0;width:1px;background:#3A3A3A}
.tch .role{font-family:var(--en);font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--lime)}
.tch .nm{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.1}
.tch p{margin:0;color:#CFCFCA;font-size:14px;line-height:1.7;letter-spacing:-.01em}
.tch .tpic{width:100%;aspect-ratio:4/5!important;border-radius:12px;margin-bottom:8px}
.tch .tpic>img{position:absolute;inset:0}
@media (max-width:900px){.trio{grid-template-columns:minmax(0,1fr)}.tch{padding-bottom:28px;border-bottom:1px solid #3A3A3A}.tch+.tch::before{display:none}.tch .tpic{max-width:420px}}

/* retreat band */
.band{position:relative;min-height:520px;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.band .photo{position:absolute;inset:0}
.wcard .photo>img,.band .photo>img{position:absolute;inset:0}
.band .photo::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.72))}
.band .wrap{position:relative;padding-top:120px;padding-bottom:64px;width:100%}
.band .lead{color:#EDEDE8;max-width:620px;margin-top:14px}

/* catalog cards (workshop) */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.filters button{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wlist{display:flex;flex-direction:column;gap:28px}
.wcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:0;border:1px solid var(--hair);border-radius:18px;overflow:hidden;text-decoration:none;background:#fff;transition:box-shadow .2s}
.wcard:hover{box-shadow:0 16px 40px rgba(0,0,0,.1)}
.wcard .photo{min-height:340px}
.wcard-body{padding:32px;display:flex;flex-direction:column;gap:14px}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);padding-top:14px;border-top:1px solid var(--hair);margin-top:auto}
.wmeta b{color:var(--ink);font-weight:700;margin-right:4px}
@media (max-width:860px){.wcard{grid-template-columns:minmax(0,1fr)}.wcard .photo{min-height:240px}.wcard-body{padding:24px}}

/* detail */
.gal{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:min(62vh,560px)}
.gal .photo:first-child{grid-row:1/3;border-radius:16px 0 0 16px}
.gal .photo:nth-child(2){border-radius:0 16px 0 0}.gal .photo:nth-child(3){border-radius:0 0 16px 0}
@media (max-width:760px){.gal{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}.gal .photo{aspect-ratio:4/3;border-radius:12px!important}.gal .photo:not(:first-child){display:none}}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:56px;align-items:start}
.aside{position:sticky;top:96px;border:1.5px solid var(--ink);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;background:#fff}
.aside dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.aside dt{color:var(--muted)}.aside dd{margin:0;font-weight:700}
@media (max-width:960px){.dgrid{grid-template-columns:minmax(0,1fr)}.aside{position:static}}
.tl{margin:0;padding:0;list-style:none;border-left:2px solid var(--ink)}
.tl li{position:relative;padding:0 0 22px 22px}
.tl li::before{content:'';position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--ink)}
.tl .t{font-family:var(--en);font-size:13px;font-weight:700;color:var(--green)}
.tl b{display:block;font-size:17px}
.tl span{font-size:15px;color:var(--muted)}
.tl li.tea::before{background:#fff}
.checks{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.checks li{position:relative;padding-left:30px;font-size:16px;line-height:1.6}
.checks li::before{content:'';position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:var(--lime);box-shadow:inset 0 0 0 5px var(--lime),inset 0 0 0 9px var(--ink)}
.prose h2{margin:56px 0 18px;font-size:26px;font-weight:900;letter-spacing:-.03em}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 14px;font-size:16px;line-height:1.8;color:var(--ink2)}

/* program */
.year{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.q{border-radius:16px;overflow:hidden;border:1px solid var(--hair);background:#fff;display:flex;flex-direction:column}
.q .photo{aspect-ratio:4/3}
.q-body{padding:20px;display:flex;flex-direction:column;gap:8px}
.q .qn{font-family:var(--en);font-weight:700;font-size:14px;color:var(--green)}
.q ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--ink2);line-height:1.7}
@media (max-width:960px){.year{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.year{grid-template-columns:minmax(0,1fr)}}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--hair);vertical-align:top}
.cmp thead th{border-bottom:2px solid var(--ink);font-size:14px}
.cmp td:first-child{font-weight:700;white-space:nowrap}
.tbl-wrap{overflow-x:auto}

/* online catalog */
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.ccard{display:flex;flex-direction:column;text-decoration:none;border-radius:16px;overflow:hidden;border:1px solid var(--hair);background:#fff;transition:transform .2s}
.ccard:hover{transform:translateY(-4px)}
.ccard .photo{aspect-ratio:16/10}
.ccard-body{padding:20px 20px 24px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard .who{margin-top:auto;padding-top:10px;font-size:14px;color:var(--muted)}
@media (max-width:960px){.cgrid{grid-template-columns:minmax(0,1fr)}}

/* selling page */
.sp-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;padding:56px 0 64px}
.sp-hero .photo{aspect-ratio:4/3;border-radius:18px}
@media (max-width:900px){.sp-hero{grid-template-columns:minmax(0,1fr);padding-top:32px}}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}

function route(){

  else if(h === 'home'){ page('home'); app.innerHTML = vHome(); bindHome(); }
  else if(h === 'workshop'){ page('workshop'); app.innerHTML = vWorkshop(); bindWorkshop(); }
  else if((m = h.match(/^w-(.+)$/)) && wById(m[1])){ page('wdetail'); app.innerHTML = vWDetail(wById(m[1])); detailNav('#workshop', '워크샵', wById(m[1]).title); }
  else if(h === 'program'){ page('program'); app.innerHTML = vProgram(); }
  else if(h === 'online'){ page('online'); app.innerHTML = vOnline(); }
  else if((m = h.match(/^c-(.+)$/)) && cById(m[1])){ page('course'); app.innerHTML = vCourse(cById(m[1])); bindCourse(cById(m[1])); detailNav('#online', '온라인강의', cById(m[1]).title); }
  else if(h === 'team' || /^t-(han|jun|lee)$/.test(h)){ page('team'); app.innerHTML = vTeam(); bindTeam(); if(h !== 'team'){ var el = document.getElementById(h); if(el){ setTimeout(function(){ el.scrollIntoView({behavior:'instant', block:'start'}); }, 0); } return; } }
  else if(h === 'day'){ page('day'); app.innerHTML = vDay(); bindDay(); }

function setSteepScene(){
  var sc = STEEP.at(steepIdx % STEEP.length), items = $$('#steepLog li'), r = $('#steepRole');
  if(r) r.textContent = '3분 · ' + sc[0];
  sc[1].forEach(function(t, i){ var li = items.at(i); if(li) li.textContent = t; });
}
function startSteep(){
  if(steepTimer){ clearInterval(steepTimer); steepTimer = null; }
  var T = $('#steepT'), arc = $('#steepArc'), items = $$('#steepLog li');
  if(!T || !arc) return;
  var C = 2 * Math.PI * 28; arc.style.strokeDasharray = C;
  var show = function(sec){ var left = 180 - sec; T.textContent = Math.floor(left / 60) + ':' + ('0' + (left % 60)).slice(-2); arc.style.strokeDashoffset = C * (1 - sec / 180);
    items.forEach(function(li, i){ li.classList.toggle('on', sec >= [20, 70, 125, 180].at(i)); }); };
  var reduce = false; try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  if(reduce){ show(180); return; }
  var sec = 0, hold = 0; setSteepScene(); show(0);
  steepTimer = setInterval(function(){
    if(!document.body.contains(T)){ clearInterval(steepTimer); steepTimer = null; return; }
    if(sec >= 180){ if(++hold > 25){ sec = 0; hold = 0; steepIdx++; setSteepScene(); } show(sec); return; }
    sec = Math.min(180, sec + 2); show(sec);
  }, 100);
}
