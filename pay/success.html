<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>결제 확인 — CHA&amp;I</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#1d242c);--ink:light-dark(#26313D,#eef1f3);--mut:light-dark(#6B727A,#a7aeb5);--line:light-dark(#E3E6EA,#38424c);--sage:#5E6F5E;--soft:light-dark(#F1F3F5,#27313b)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 'Noto Sans KR',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:clamp(32px,8vw,72px) max(5vw,18px)}
.logo{letter-spacing:.2em;font-size:18px;color:var(--ink);text-decoration:none}
h1{font-size:clamp(24px,4vw,30px);font-weight:500;line-height:1.25;margin:28px 0 10px}
p{margin:0 0 14px}.mut{color:var(--mut);font-size:14px}
.box{background:var(--soft);border-radius:14px;padding:16px 18px;margin:18px 0}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}.box dt{color:var(--mut)}.box dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:500}
.btn.p{background:#26313D;color:#fff}.btn.l{border:1px solid var(--line);color:var(--ink)}
.bad{color:#B3261E}
</style></head><body><div class="wrap">
<a class="logo" href="/">CHA&amp;I</a>
<h1 id="t">결제를 확인하고 있어요</h1>
<div style="display:flex;gap:6px;font-size:13px;color:var(--mut);margin-top:18px"><span>상품 선택</span>›<span>주문서 작성</span>›<span>결제</span>›<b style="color:var(--ink)">완료</b></div>
<p id="m">창을 닫지 말고 잠시만 기다려 주세요.</p>
<div class="box" id="box" hidden><dl id="dl"></dl></div>
<p class="mut" id="n"></p>
<div class="btns"><a class="btn p" href="/contact">문의하기</a><a class="btn l" href="/refund">취소·환불정책</a><a class="btn l" href="/">처음으로</a></div>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search), $=function(i){return document.getElementById(i)};
  function show(t,m,cls){$('t').textContent=t;$('m').textContent=m;if(cls)$('m').className=cls;}
  var body={paymentKey:q.get('paymentKey')||'',orderId:q.get('orderId')||'',amount:Number(q.get('amount')||0)};
  if(!body.paymentKey||!body.orderId||!body.amount){show('결제 정보가 없어요','결제는 진행되지 않았어요. 결제를 다시 시도하거나 문의해 주세요.','bad');return;}
  /* 주문자(이메일·이름)와 로그인 토큰을 함께 보냄 → 서버가 주문을 회원 DB에 저장, 로그인 회원이면 수강권 발급 */
  try{body.buyer=JSON.parse(sessionStorage.getItem('chai_buyer')||'{}');body.coupon=sessionStorage.getItem('chai_coupon')||'';}catch(e){body.buyer={};}
  try{var tk=JSON.parse(localStorage.getItem('sb-mryawowqarptvtpxcwxl-auth-token')||'null');if(tk&&tk.access_token)body.token=tk.access_token;}catch(e){}
  /* 같은 화면을 새로고침해도 승인은 한 번만 (서버도 Idempotency-Key로 막음) */
  fetch('/api/payments/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().catch(function(){return {ok:false,code:'BAD_RESPONSE'}})})
  .then(function(d){
    history.replaceState(null,'',location.pathname);   /* 주소창에서 결제 키 지우기 */
    if(d.ok){
      if(d.waiting){show('입금을 기다리고 있어요','아래 계좌로 기한 안에 입금하면 자동으로 결제가 완료되고 메일로 알려 드려요.');var v=d.vbank||{};var dl0=$('dl');[['입금 은행',v.bank],['계좌번호',v.account],['예금주',v.holder],['입금 기한',v.due?new Date(v.due).toLocaleString('ko-KR'):'']].forEach(function(x){if(!x[1])return;var a=document.createElement('dt');a.textContent=x[0];var b=document.createElement('dd');b.textContent=x[1];dl0.appendChild(a);dl0.appendChild(b);});}
      else if(d.mode==='test') show('테스트 결제가 완료됐어요','테스트 모드라 실제로 청구되지 않았어요. 결제 흐름 확인용이에요.'); else show('결제가 완료됐어요','안내 메일과 함께 담당자가 일정을 연락드릴게요.');
      var dl=$('dl');[['주문 번호',d.orderId],['상품',d.orderName],['금액',Number(d.amount).toLocaleString('ko-KR')+'원'+(d.discount?' (할인 '+Number(d.discount).toLocaleString('ko-KR')+'원'+(d.coupon?' · '+d.coupon:'')+')':'')],['결제 수단',d.method]].forEach(function(x){if(!x[1])return;var a=document.createElement('dt');a.textContent=x[0];var b=document.createElement('dd');b.textContent=x[1];dl.appendChild(a);dl.appendChild(b);});
      $('box').hidden=false;$('n').textContent=(d.grants?(d.enrolled?'수강권이 내 학습에 들어갔어요. ':'같은 이메일로 회원가입·로그인하면 내 학습에서 강의를 볼 수 있어요. '):'')+'취소·환불은 취소·환불정책의 기준을 따라요.';if(d.grants){var bt=document.querySelector('.btns');bt.insertAdjacentHTML('afterbegin','<a class="btn p" href="/my">내 학습으로</a>');bt.children[1].className='btn l';}
    } else if(d.code==='NOT_READY'){
      show('온라인 결제는 아직 열리지 않았어요','결제는 완료되지 않았고, 비용도 청구되지 않아요. 문의 페이지로 연락해 주시면 안내해 드릴게요.');
    } else {
      show('결제를 완료하지 못했어요','결제는 승인되지 않았어요. 잠시 뒤 다시 시도하거나 문의해 주세요. (코드: '+String(d.code||'').slice(0,40)+')','bad');
    }
  })
  .catch(function(){show('결제 확인이 늦어지고 있어요','인터넷 연결을 확인하고 이 화면을 새로고침해 주세요. 결제가 두 번 되지는 않아요.','bad');});
})();
</script><script>try{var _q=new URLSearchParams(location.search);fetch('/api/lead',{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ev:'pay_done',path:location.pathname,item:(_q.get('item')||'').replace(/[^a-z0-9-]/g,'')})}).catch(function(){})}catch(e){}</script><script defer src="/_vercel/insights/script.js"></script></body></html>
